# Remove the version line entirely

services:
  kafka1:
    image: bitnami/kafka:3.6.1
    container_name: kafka1
    environment:
      - KAFKA_KRAFT_CLUSTER_ID=${CLUSTER_ID}
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka1:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=3
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - ALLOW_PLAINTEXT_LISTENER=yes
      - BITNAMI_DEBUG=yes
    ports:
      - "9092:9092"
    networks:
      - kafka-net
    volumes:
      - kafka1_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  kafka2:
    image: bitnami/kafka:3.6.1
    container_name: kafka2
    environment:
      - KAFKA_KRAFT_CLUSTER_ID=${CLUSTER_ID}
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka2:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=3
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - ALLOW_PLAINTEXT_LISTENER=yes
      - BITNAMI_DEBUG=yes
    ports:
      - "9094:9092"
    networks:
      - kafka-net
    volumes:
      - kafka2_data:/bitnami/kafka
    depends_on:
      - kafka1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  kafka3:
    image: bitnami/kafka:3.6.1
    container_name: kafka3
    environment:
      - KAFKA_KRAFT_CLUSTER_ID=${CLUSTER_ID}
      - KAFKA_CFG_NODE_ID=3
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka3:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=3
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - ALLOW_PLAINTEXT_LISTENER=yes
      - BITNAMI_DEBUG=yes
    ports:
      - "9096:9092"
    networks:
      - kafka-net
    volumes:
      - kafka3_data:/bitnami/kafka
    depends_on:
      - kafka1
      - kafka2
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  kafka-setup:
    image: bitnami/kafka:3.6.1
    container_name: kafka-setup
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    networks:
      - kafka-net
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:9092,kafka2:9092,kafka3:9092
    command: >
      bash -c "
        echo 'Waiting for Kafka to be ready...'
        sleep 30
        
        echo 'Creating topics...'
        kafka-topics.sh --bootstrap-server kafka1:9092 --create --topic video-processing-requests --partitions 3 --replication-factor 3 --if-not-exists
        kafka-topics.sh --bootstrap-server kafka1:9092 --create --topic video-frames --partitions 3 --replication-factor 3 --if-not-exists
        kafka-topics.sh --bootstrap-server kafka1:9092 --create --topic frame-descriptions --partitions 3 --replication-factor 3 --if-not-exists
        kafka-topics.sh --bootstrap-server kafka1:9092 --create --topic emotion-events --partitions 3 --replication-factor 3 --if-not-exists
        kafka-topics.sh --bootstrap-server kafka1:9092 --create --topic commentary-text --partitions 3 --replication-factor 3 --if-not-exists
        kafka-topics.sh --bootstrap-server kafka1:9092 --create --topic audio-output --partitions 3 --replication-factor 3 --if-not-exists
        
        echo 'Topics created successfully!'
        kafka-topics.sh --bootstrap-server kafka1:9092 --list
      "
    restart: "no"

  streamlit-dashboard:
    build: ./services/streamlit_dashboard
    ports:
      - "8501:8501"
    depends_on:
      - kafka-setup
    networks:
      - kafka-net
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:9092,kafka2:9092,kafka3:9092
    volumes:
      - ./services/dataset:/app/dataset
      - ./shared_temp:/app/shared_temp:Z  
      - tts_audio_output:/app/audio_output
      - ./services/shared:/app/services/shared
    user: "1000:1000"

  frame-ingestion:
    build: ./services/frame_ingestion
    depends_on:
      - kafka-setup
    networks:
      - kafka-net
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:9092,kafka2:9092,kafka3:9092
    volumes:
      - ./services/dataset:/app/dataset
      - ./shared_temp:/app/shared_temp:Z  
    user: "1000:1000"

  detection-service:
    build: ./services/detection_service
    depends_on:
      - kafka-setup
    networks:
      - kafka-net
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:9092,kafka2:9092,kafka3:9092
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - TURBOLINE_API_KEY=${TURBOLINE_API_KEY}
      - TURBOLINE_API_URL=${TURBOLINE_API_URL}

  eventlogic:
    build: ./services/eventlogic
    depends_on:
      - kafka-setup
    networks:
      - kafka-net
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:9092,kafka2:9092,kafka3:9092

  commentary-generator:
    build: ./services/commentary_generator
    depends_on:
      - kafka-setup
    networks:
      - kafka-net
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:9092,kafka2:9092,kafka3:9092
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    volumes:
      - ./services/dataset:/app/dataset
      - ./generated_commentary_json:/app/tts_outputs

  tts-service:
    build: ./services/tts_service
    depends_on:
      - kafka-setup
    networks:
      - kafka-net
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:9092,kafka2:9092,kafka3:9092
    volumes:
      - ./services/dataset:/app/dataset
      - tts_audio_output:/app/audio_output

volumes:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  tts_audio_output:

networks:
  kafka-net:
    driver: bridge
